<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>sho-app</title>
<style>
:root{--bg:#10171b;--card:#18242a;--line:#2d3f47;--text:#eaf3f6;--muted:#9db3bb;--accent:#5fb3c9}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#1f343c,var(--bg) 60%);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Hiragino Sans","Noto Sans JP",sans-serif;display:flex;flex-direction:column;align-items:center;padding:48px 16px}
h1{font-size:34px;margin:0 0 6px;letter-spacing:.5px}
.lead{color:var(--muted);margin:0 0 28px;font-size:14px}
.card{display:block;width:100%;max-width:520px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 22px;color:inherit;text-decoration:none;transition:.15s}
.card:hover{border-color:var(--accent);transform:translateY(-2px)}
.card{display:flex;gap:16px;align-items:flex-start;margin-bottom:16px}
.card .ic{flex:none;width:52px;height:52px;border-radius:12px;background:#10262d;border:1px solid var(--line);display:grid;place-items:center;color:var(--accent);transition:.15s}
.card .ic svg{width:34px;height:34px}
.card:hover .ic{border-color:var(--accent);box-shadow:0 0 14px rgba(95,179,201,.35)}
.card .ic.y{color:#f2b705}.card:hover .ic.y{border-color:#f2b705;box-shadow:0 0 14px rgba(242,183,5,.3)}
.card .bd{min-width:0}
.card b{font-size:20px}
.card p{color:var(--muted);margin:8px 0 0;line-height:1.7;font-size:14px}
.tag{display:inline-block;margin-top:10px;font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
footer{margin-top:auto;padding-top:40px;color:#6f858d;font-size:12px}
</style>
</head>
<body>
  <h1>sho-app</h1>
  <p class="lead">つくったアプリの置き場所です。</p>
  <a class="card" href="drone/">
    <span class="ic" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="12.5" y="12.5" width="7" height="7" rx="1.5"/><path d="M12.5 12.5 8 8M19.5 12.5 24 8M12.5 19.5 8 24M19.5 19.5 24 24"/><circle cx="7" cy="7" r="4"/><circle cx="25" cy="7" r="4"/><circle cx="7" cy="25" r="4"/><circle cx="25" cy="25" r="4"/></svg></span>
    <span class="bd">
      <b>どぼくドローンごっこ</b>
      <p>操縦・安全判断・撮影計画・写真測量を、3D空間で体験しながら学べる教材アプリです。</p>
      <span class="tag">v0.34 ・ パソコン推奨（スマホでも遊べます）</span>
    </span>
  </a>
  <a class="card" href="shovel/">
    <span class="ic y" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="24" width="18" height="5" rx="2.5"/><path d="M3.5 24v-5.5h5.5v-5h5v10.5"/><path d="M14 18.5 21 5l7 6"/><path d="M28 11l1.5 6.5-5 .5z"/></svg></span>
    <span class="bd">
      <b>パワショベとダンプ！</b>
      <p>パワーショベルで土を掘り、ダンプトラックへ積み込んで運ぶ、建設機械の操作を3Dで体験できるアプリです。</p>
      <span class="tag">v2.8</span>
    </span>
  </a>
  <footer>2026 (C) Shotaro Kai</footer>
</body>
</html>
