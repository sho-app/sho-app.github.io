<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Profile ｜ sho-app</title>
<style>
:root{--bg:#10171b;--card:#18242a;--line:#2d3f47;--text:#eaf3f6;--muted:#9db3bb;--accent:#5fb3c9}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#1f343c,var(--bg) 60%);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Hiragino Sans","Noto Sans JP",sans-serif;display:flex;flex-direction:column;align-items:center;padding:40px 16px}
h1{font-size:28px;margin:0 0 20px;letter-spacing:.5px}
.namecard{width:100%;max-width:520px}
.namecard img{display:block;width:100%;height:auto;filter:drop-shadow(0 8px 18px rgba(0,0,0,.45))}
.box{width:100%;max-width:520px;margin-top:22px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 20px}
.box h2{font-size:15px;margin:0 0 8px;color:var(--accent)}
.box ul{margin:0;padding-left:1.2em;line-height:1.9}
.box a{color:var(--text)}
.back{margin-top:26px;color:var(--muted);text-decoration:none;font-size:14px;border:1px solid var(--line);border-radius:999px;padding:6px 16px}
.back:hover{border-color:var(--accent);color:var(--text)}
footer{margin-top:auto;padding-top:36px;color:#6f858d;font-size:12px}
</style>
</head>
<body>
  <h1>Profile</h1>
  <div class="namecard"><img src="card.webp" width="900" height="574" alt="名刺：シビルテックAIオーケストレイター Shotaro Kai（カイ ショウタロウ）"></div>
  <div class="box">
    <h2>つくったアプリ</h2>
    <ul>
      <li><a href="../drone/">どぼくドローンごっこ</a></li>
      <li><a href="../shovel/">パワショベとダンプ！</a></li>
    </ul>
  </div>
  <a class="back" href="../">← トップへ戻る</a>
  <footer>2026 (C) Shotaro Kai</footer>
</body>
</html>
